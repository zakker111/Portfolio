name: Lowercase path migration (one-off)

# GitHub Pages project paths are case-sensitive, and a URL that sites such as
# Facebook store in a profile field comes back lowercased, so the site has to be
# served from /portfolio/ rather than /Portfolio/. This job rewrites every
# absolute reference to the lowercase path, runs the guards, and records the new
# frozen index.html baseline. It is deleted once it has run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: rewrite absolute URLs to /portfolio/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite references and run the guards
        run: |
          set -euo pipefail
          for f in index.html tools.html about.html links.html sitemap.xml robots.txt \
                   .github/scripts/live-smoke.mjs AGENTS.md; do
            sed -i 's|zakker111\.github\.io/Portfolio|zakker111.github.io/portfolio|g' "$f"
          done
          sed -i "s|'/Portfolio/'|'/portfolio/'|g" index.html
          sed -i 's|/Portfolio/|/portfolio/|g' 404.html .github/scripts/test-404.mjs .github/scripts/guard-selftest.mjs AGENTS.md
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path('.github/scripts/test-404.mjs')
          s = p.read_text()
          s = s.replace(r'\/Portfolio\/', r'\/portfolio\/')
          s = s.replace("'/portfolio/Portfolio/tools'", "'/portfolio/portfolio/tools'")
          p.write_text(s)
          PY
          echo '--- leftovers that should only be visible words ---'
          grep -rn 'Portfolio' --include=*.html --include=*.mjs --include=*.xml --include=*.txt --include=*.md . \
            | grep -viE 'portfolio home|Portfolio pushes|<h1>Portfolio</h1>|of \*\*zakker111\*\*|github\.com/zakker111' || true
          node .github/scripts/test-404.mjs
          node .github/scripts/check-honest-copy.mjs
          node .github/scripts/guard-selftest.mjs

      - name: Commit the migration and record the new baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Serve the site from the lowercase /portfolio/ path"
          NEW=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "migration commit: $NEW ($SHORT)"
          sed -i "s|a8a8354|$SHORT|g" AGENTS.md
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Record the frozen index.html baseline as $SHORT"
          fi
          git push origin HEAD:main
          git --no-pager log --oneline -3
