name: Refresh portfolio

on:
  schedule:
    # Every Monday 07:15 UTC — plus Thursday same time, so the page is
    # refreshed about twice a week ("every week or so").
    - cron: '15 7 * * 1'
    - cron: '15 7 * * 4'
    # keep the published-games snapshot fresh between the weekly runs too
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Commit even when nothing changed'
        required: false
        default: 'false'

permissions:
  contents: write
  # needed to ask pages.yml to deploy after a bot-authored commit
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repo list from GitHub API
        run: |
          mkdir -p data
          curl -sf "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&sort=pushed" \
            -o data/repos.json || echo "[]" > data/repos.json

      - name: Build snapshot + check links + update index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-snapshot.py "${{ github.repository_owner }}" data/repos.json data/published.json

      - name: Ignore timestamp-only snapshot churn
        # The snapshot always comes back with a fresh "updated" stamp, so
        # without this every scheduled run would commit and redeploy the page
        # even when no repository actually changed. Keeping the previous stamp
        # leaves the file byte-for-byte identical, so nothing is committed.
        run: |
          python3 - <<'PY'
          import json, subprocess
          path = 'data/published.json'
          with open(path, encoding='utf-8') as handle:
              new = json.load(handle)
          try:
              old = json.loads(subprocess.run(['git', 'show', 'HEAD:' + path],
                                              capture_output=True, text=True,
                                              check=True).stdout)
          except Exception:
              raise SystemExit(0)
          if new.get('repos') == old.get('repos') and new.get('owner') == old.get('owner'):
              new['updated'] = old.get('updated', new['updated'])
              with open(path, 'w', encoding='utf-8') as handle:
                  handle.write(json.dumps(new, indent=2))
              print('repo list unchanged - kept the previous snapshot stamp')
          PY

      - name: Show link report
        run: cat data/link-report.txt || true

      - name: Commit & push (only if changed)
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json data/link-report.txt index.html
          if git diff --cached --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "site=false" >> "$GITHUB_OUTPUT"
          else
            if git diff --cached --name-only | grep -qE '^(index\.html|assets/|og-image|robots\.txt|\.nojekyll)'; then
              echo "site=true" >> "$GITHUB_OUTPUT"
            else
              echo "site=false" >> "$GITHUB_OUTPUT"
            fi
            git commit -m "Weekly refresh: snapshot, link checks, updated-days"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        # Commits pushed with GITHUB_TOKEN never start push-triggered workflows,
        # so this dispatch is what deploys a bot commit — but only when the
        # commit actually touched the site itself.
        if: steps.commit.outputs.changed == 'true' && steps.commit.outputs.site == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -f ref=main

      - name: Fail when any link on the page or in the docs is dead
        # Runs last on purpose: a dead link turns the whole refresh red (and
        # GitHub emails the owner about failed scheduled runs) without blocking
        # the snapshot above.
        run: python3 tools/check-links.py
