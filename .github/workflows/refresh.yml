name: Refresh portfolio

on:
  schedule:
    # Every Monday 07:15 UTC — plus Thursday same time, so the page is
    # refreshed about twice a week ("every week or so").
    - cron: '15 7 * * 1'
    - cron: '15 7 * * 4'
    # keep the published-games snapshot fresh between the weekly runs too
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Commit even when nothing changed'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repo list from GitHub API
        run: |
          mkdir -p data
          curl -sf "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&sort=pushed" \
            -o data/repos.json || echo "[]" > data/repos.json

      - name: Build snapshot + check links + update index.html
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/build-snapshot.py "${{ github.repository_owner }}" data/repos.json data/published.json

      - name: Show link report
        run: cat data/link-report.txt || true

      - name: Commit & push (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json data/link-report.txt index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Weekly refresh: snapshot, link checks, updated-days"
            git push origin HEAD:main
          fi
