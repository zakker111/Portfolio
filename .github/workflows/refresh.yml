name: Refresh published-games snapshot

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch repo list from GitHub API
        run: |
          mkdir -p data
          curl -sf "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&sort=pushed" \
            -o data/repos.json

      - name: Build snapshot JSON
        run: python3 tools/build-snapshot.py "${{ github.repository_owner }}" data/repos.json data/published.json

      - name: Commit & push (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh published-games snapshot"
            git push origin HEAD:main
          fi
