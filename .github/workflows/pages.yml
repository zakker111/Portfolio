name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
    # Redeploy only when the site's own files change. The scheduled refresh
    # commits data/ and docs updates; those must never rebuild the page.
    paths:
      - "index.html"
      - "assets/**"
      - "og-image.png"
      - "og-image.svg"
      - "robots.txt"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
