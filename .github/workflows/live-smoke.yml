name: Live portfolio smoke test

on:
  schedule:
    - cron: '43 */6 * * *'   # every six hours, offset from the snapshot job
  workflow_dispatch:
  # GitHub's internal Pages workflow runs once per deployment and finishes only
  # after the new version is published, so this starts exactly one run per
  # deploy — instead of one per status event of the github-pages environment,
  # most of which were skipped — and catches a broken deploy immediately rather
  # than at the next six-hour check. The glob matches that workflow's name
  # however GitHub renders it in the payload (it reports both
  # "pages build and deployment" and "pages-build-deployment").
  workflow_run:
    workflows: ["pages*build*deployment"]
    types: [completed]

permissions:
  contents: read

concurrency:
  # One check at a time, and never cancel a running one: it would leave the
  # deployment it was checking unverified. A newer run replaces only a
  # still-pending one, and it tests the same live site anyway.
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # A failed Pages build leaves the previous version live, so there is nothing
    # new to smoke-test; skip the job rather than report the old site as a pass.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.65.1
          npx playwright install --with-deps chromium

      - name: Run live smoke test
        run: node .github/scripts/live-smoke.mjs
