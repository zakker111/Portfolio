name: Patch README

# Temporary helper: README.md is too large to push through the file API, so this
# workflow applies tools/patch-readme.py and commits the result. Both files are
# deleted once the change is live.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply the README patch
        run: python3 tools/patch-readme.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "::error::README.md unchanged — the section has moved."
            exit 1
          fi
          git commit -m "Document that Pages rebuilds only for site files"
          git push origin HEAD:main
