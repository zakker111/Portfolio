name: Refresh update snapshot

on:
  schedule:
    - cron: '17 */6 * * *'   # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.github/scripts/build-snapshot.mjs'
      - '.github/scripts/test-404.mjs'
      - '.github/workflows/refresh-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: refresh-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test 404 redirect map
        run: node --test .github/scripts/test-404.mjs

      - name: Build snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-snapshot.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/published.json)" ]; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Refresh update snapshot"
          git push
