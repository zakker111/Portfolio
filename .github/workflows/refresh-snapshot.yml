name: Refresh update snapshot

on:
  schedule:
    - cron: '17 */6 * * *'   # every six hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '.github/scripts/test-404.mjs'
      - '.github/workflows/refresh-snapshot.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test 404 redirect map
        run: node --test .github/scripts/test-404.mjs

  snapshot:
    # A snapshot commit on a portfolio push starts a second Pages build and
    # cancels the build for the push itself. Pushes only run the test; the
    # snapshot job runs on the schedule or when dispatched by hand.
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: refresh-snapshot
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/build-snapshot.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/published.json)" ]; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          git commit -m "Refresh update snapshot"
          git push
